<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Vault | Xavier OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --void-black: #020204; }
        body { font-family: 'Rajdhani', sans-serif; background: var(--void-black); color: #e0e0e0; }
        .quantum-panel { background: rgba(10, 14, 39, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .file-item { animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen">

    <header class="quantum-panel sticky top-0 z-50 px-6 py-4 border-b border-blue-500/20">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <button onclick="window.location.href='index.html'" class="text-gray-400 hover:text-white transition">← Back to Hub</button>
                <h1 class="font-orbitron text-2xl font-bold text-blue-400">QUANTUM VAULT</h1>
            </div>
            <div class="text-sm text-gray-400">Encryption: <span class="text-green-400 font-mono">AES-4096</span></div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8">
        <div class="grid lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-6">
                <div class="quantum-panel rounded-2xl p-6">
                    <h3 class="font-orbitron text-xl font-bold mb-4 text-blue-400">Secure Storage</h3>
                    <input type="file" id="file-upload" class="hidden" multiple onchange="handleUpload(event)">
                    <button onclick="document.getElementById('file-upload').click()" class="w-full mb-4 bg-blue-600/30 border border-blue-500 py-4 rounded-lg hover:bg-blue-600/50 transition flex items-center justify-center gap-2">
                        <span>📁</span> Encrypt & Upload Files
                    </button>
                    
                    <div id="file-list" class="space-y-2 max-h-96 overflow-y-auto">
                        <div class="text-gray-500 text-center py-8">No files uploaded yet</div>
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="quantum-panel rounded-2xl p-6">
                    <h3 class="font-orbitron text-lg font-bold mb-4 text-cyan-400">Storage Usage</h3>
                    <div class="w-full bg-gray-800 rounded-full h-2 mb-2">
                        <div id="storage-bar" class="bg-blue-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-400" id="used-space">0 MB</span>
                        <span class="text-gray-500" id="total-space">10 GB</span>
                    </div>
                </div>

                <div class="quantum-panel rounded-2xl p-6 border border-green-500/20 bg-green-900/5">
                    <h3 class="font-orbitron text-lg font-bold mb-4 text-green-400">Security Status</h3>
                    <div class="space-y-3 text-sm">
                        <div class="flex justify-between items-center">
                            <span class="text-gray-400">Quantum Key</span>
                            <span class="text-green-400 flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span> Active
                            </span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-gray-400">Self-Destruct</span>
                            <button onclick="toggleDestruct()" id="destruct-btn" class="text-gray-400 hover:text-red-400 transition">Disabled</button>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-gray-400">Backup</span>
                            <span class="text-cyan-400">Encrypted</span>
                        </div>
                    </div>
                </div>

                <div class="quantum-panel rounded-2xl p-6">
                    <h3 class="font-orbitron text-lg font-bold mb-4 text-red-400">Emergency Actions</h3>
                    <button onclick="shredAll()" class="w-full bg-red-600/30 border border-red-500 text-red-400 py-3 rounded hover:bg-red-600/50 transition mb-2">🔥 Shred All Files</button>
                    <button onclick="exportBackup()" class="w-full bg-blue-600/30 border border-blue-500 text-blue-400 py-3 rounded hover:bg-blue-600/50 transition">📦 Export Backup</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        let files = JSON.parse(localStorage.getItem('xavier_files') || '[]');
        const maxStorage = 10 * 1024 * 1024 * 1024; // 10GB
        
        function formatSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        function updateStorage() {
            const used = files.reduce((acc, f) => acc + f.size, 0);
            const percent = (used / maxStorage) * 100;
            document.getElementById('storage-bar').style.width = percent + '%';
            document.getElementById('used-space').textContent = formatSize(used);
            
            const session = JSON.parse(localStorage.getItem('xavier_session') || '{}');
            session.storage = Math.round(used / (1024 * 1024));
            localStorage.setItem('xavier_session', JSON.stringify(session));
        }
        
        function renderFiles() {
            const list = document.getElementById('file-list');
            if (files.length === 0) {
                list.innerHTML = '<div class="text-gray-500 text-center py-8">No files uploaded yet</div>';
                return;
            }
            
            list.innerHTML = files.map((file, idx) => `
                <div class="file-item flex justify-between items-center bg-black/40 p-3 rounded border border-blue-500/20 hover:border-blue-500/50 transition group">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <span class="text-blue-400 text-xl">${getFileIcon(file.type)}</span>
                        <div class="truncate">
                            <div class="text-sm text-white truncate">${file.name}</div>
                            <div class="text-xs text-gray-500">${formatSize(file.size)} • ${new Date(file.date).toLocaleDateString()}</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 opacity-0 group-hover:opacity-100 transition">
                        <button onclick="downloadFile(${idx})" class="text-xs bg-blue-600/30 text-blue-400 px-3 py-1 rounded border border-blue-500 hover:bg-blue-600/50">Download</button>
                        <button onclick="deleteFile(${idx})" class="text-xs bg-red-600/30 text-red-400 px-3 py-1 rounded border border-red-500 hover:bg-red-600/50">Delete</button>
                    </div>
                </div>
            `).join('');
            updateStorage();
        }
        
        function getFileIcon(type) {
            if (type.includes('image')) return '🖼️';
            if (type.includes('video')) return '🎬';
            if (type.includes('audio')) return '🎵';
            if (type.includes('pdf')) return '📄';
            if (type.includes('zip') || type.includes('rar')) return '📦';
            return '📄';
        }
        
        function handleUpload(e) {
            const uploaded = Array.from(e.target.files);
            uploaded.forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    files.push({
                        name: file.name,
                        size: file.size,
                        type: file.type,
                        data: event.target.result,
                        date: new Date().toISOString()
                    });
                    localStorage.setItem('xavier_files', JSON.stringify(files));
                    renderFiles();
                };
                reader.readAsDataURL(file);
            });
        }
        
        function deleteFile(idx) {
            if (confirm(`Delete ${files[idx].name}?`)) {
                files.splice(idx, 1);
                localStorage.setItem('xavier_files', JSON.stringify(files));
                renderFiles();
            }
        }
        
        function downloadFile(idx) {
            const file = files[idx];
            const a = document.createElement('a');
            a.href = file.data;
            a.download = file.name;
            a.click();
        }
        
        function toggleDestruct() {
            const btn = document.getElementById('destruct-btn');
            if (btn.textContent === 'Disabled') {
                if (confirm('Enable self-destruct? Files will be shredded after 3 failed access attempts.')) {
                    btn.textContent = 'Armed';
                    btn.className = 'text-red-400 font-bold animate-pulse';
                }
            } else {
                btn.textContent = 'Disabled';
                btn.className = 'text-gray-400 hover:text-red-400 transition';
            }
        }
        
        function shredAll() {
            if (confirm('🔥 WARNING: This will permanently delete ALL files. Continue?')) {
                files = [];
                localStorage.setItem('xavier_files', JSON.stringify(files));
                renderFiles();
                alert('All files shredded successfully');
            }
        }
        
        function exportBackup() {
            const data = JSON.stringify(files);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `xavier_backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        window.addEventListener('DOMContentLoaded', renderFiles);
    </script>
</body>
</html>
